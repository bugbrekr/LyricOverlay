[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyric-overlay"
version = "0.1.0"
description = "View synced lyrics of any song on a floating window"
dependencies = [
    "pywebview>=5.1",
    "toml>=0.10.2",
    "pynput>=1.7.7",
    "dbus-python>=1.3.2",
    "requests>=2.32.3",
    "Jinja2>=3.1.4",
    "PyGObject>=3.48.2",
    "qtpy>=2.4.3",
    "PyQt6>=6.9.1",
    "PyQt6-WebEngine>=6.9.0"
]

[project.scripts]
lyric-overlay = "lyric_overlay.main:main"
